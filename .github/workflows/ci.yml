name: CI
on:
  push:
  pull_request:

# A newer push to the same branch makes an older run pointless.
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npx tsc --noEmit
      - run: npm run lint
      - name: Pure checks (career, medals, replays, turn bans)
        run: npx tsx --test scripts/sim/unit.test.ts
      - uses: actions/cache@v4
        with:
          path: .next/cache
          key: next-${{ runner.os }}-${{ hashFiles('package-lock.json') }}-${{ hashFiles('src/**') }}
          restore-keys: next-${{ runner.os }}-${{ hashFiles('package-lock.json') }}-
      - run: npm run build

  # The simulation suite is the slow part (about nine minutes in one piece), so it runs as two jobs side by side: the
  # real-city baselines (the checks that catch a sim change quietly moving a level's star lines), and everything else.
  sim-baselines:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - name: Real-city baselines
        run: npm run test:sim -- --test-name-pattern="baseline holds"

  sim-behaviour:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - name: Levels, incidents, gantries and lefts
        run: npm run test:sim -- --test-name-pattern="reach a destination|can be improved|Code Three|School Run|First Shift|Transit Street|Pile-Up|speed limits|Clover Crossing|stalled semi|closing a lane|Continuous Flow|signal phasing"

  # The newer features: weather and night, lane and turn rules, transit, driving a car, and exact replays.
  sim-features:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - name: Conditions, rules, transit, driving and replays
        run: |
          npm run test:sim -- --test-name-pattern="conditions:|carpool and express|turn bans:|transit: stops|driving: a car|replays: a recorded|rules:|Season One"
